apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-configmap
  namespace: auth
data:
  DB_URL: "jdbc:postgresql://host.minikube.internal:5432/postgres"
  REDIS_HOST: "host.minikube.internal"
  REDIS_PORT: "6379"
  REGISTRY_HOSTNAME: "registry-service.registry.svc.cluster.local"
  REGISTRY_PORT: "8761"
  SERVER_PORT: "9000"
  AUTH_SERVICE_NAME: "auth-service.auth.svc.cluster.local"
  SSL_ENABLED: "false"