spring:
  application:
    name: AuthorizationService
  datasource:
    url: ${DB_URL}
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: off
  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}
server:
  port: ${SERVER_PORT}
  ssl:
    enabled: ${SSL_ENABLED}
    key-store: ${SSL_KEYSTORE}
    key-store-type: ${SSL_KEYSTORE_TYPE}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-password: ${SSL_KEY_PASSWORD}


token:
  format: self-contained
  access-token-ttl: 300
  refresh-token-ttl: 2592000
  authorization-code-ttl: 300
  reuse-refresh-tokens: true
  id-token-signature-algorithm: RS256



auth:
  allowed-scopes: openid, profile, email, phone, address, read, write
  allowed-grant-types: authorization_code, refresh_token, client_credentials
  client-authentication-methods: client_secret_basic, client_secret_post
client:
  require-proof-key: false
  require-authorization-consent: false


# ============================================
# EUREKA CLIENT CONFIGURATION
# ============================================

eureka:
  client:
    service-url:
      defaultZone: "http://${REGISTRY_CLIENT_USERNAME}:${REGISTRY_CLIENT_PASSWORD}@${REGISTRY_HOSTNAME}:${REGISTRY_PORT}/eureka/"

    enabled: true
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
    disable-delta: false
    healthcheck:
      enabled: true
    refresh:
      enable: true
    region: us-east-1
    availability-zones:
      us-east-1: zone1, zone2
    prefer-same-zone-eureka: true
    webclient:
      enabled: false
    timeout:
      connect-timeout: 5000
      connect-request-timeout: 8000
      socket-timeout: 10000
    tls:
      enabled: ${SSL_ENABLED}
      key-store: ${SSL_KEYSTORE}
      key-store-type: ${SSL_KEYSTORE_TYPE}
      key-store-password: ${SSL_KEYSTORE_PASSWORD}
      key-password: ${SSL_KEY_PASSWORD}
      trust-store: ${SSL_TRUSTSTORE}
      trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
      trust-store-type: ${SSL_TRUSTSTORE_TYPE}
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 8
    eureka-server-total-connections: 200
    eureka-server-total-connections-per-host: 50
    eureka-connection-idle-timeout-seconds: 30
    filter-only-up-instances: true
    log-delta-diff: true
    g-zip-content: true
  instance:
    hostname: ${AUTH_SERVICE_NAME}
    prefer-ip-address: false
    non-secure-port: ${server.port}
    non-secure-port-enabled: false
    secure-port: ${server.port}
    secure-port-enabled: true
    status-page-url: http://${eureka.instance.hostname}:${eureka.instance.secure-port}/actuator/info
    health-check-url: http://${eureka.instance.hostname}:${eureka.instance.secure-port}/actuator/health
    home-page-url: http://${eureka.instance.hostname}:${eureka.instance.secure-port}/
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 60
    metadata-map:
      zone: zone1
      version: 1.0.0
      profile: dev
    initial-status: UP
    instance-id: ${spring.application.name}:${POD_NAME}